name: Build

on:
  push:
    tags:
      - '**'
      - '!latest'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Read .github/target.toml and expose it as a matrix.include payload, so all
  # platforms share the single `build` job below.
  prepare:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.set.outputs.targets }}
      sccache_size: ${{ steps.set.outputs.sccache_size }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: toml2json,jaq
      - uses: dtolnay/rust-toolchain@stable
      - name: Test native build helpers
        run: |
          tail -n +7 scripts/build-cronet.rs > "$RUNNER_TEMP/build-cronet-tests.rs"
          cp scripts/boringssl.rs "$RUNNER_TEMP/boringssl.rs"
          cp scripts/windows_crt.rs "$RUNNER_TEMP/windows_crt.rs"
          rustc --edition 2021 --test "$RUNNER_TEMP/build-cronet-tests.rs" -o "$RUNNER_TEMP/build-cronet-tests"
          "$RUNNER_TEMP/build-cronet-tests"
      - name: Build matrix from target.toml
        id: set
        run: |
          targets=$(toml2json .github/target.toml | jaq -c '.target')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          # Split the 10 GiB GHA cache quota evenly across targets so their
          # per-target sccache caches coexist instead of LRU-evicting each other.
          count=$(echo "$targets" | jaq 'length')
          size=$(( 10240 / count ))
          echo "sccache_size=${size}M" >> "$GITHUB_OUTPUT"
          echo "targets: $count -> sccache size per target: ${size}M"
          echo "$targets" | jaq .

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: dtolnay/rust-toolchain@nightly

      - name: Install zstd (musl)
        if: runner.os == 'Linux' && matrix.libc == 'musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      # Only Linux glibc targets pull a Debian sysroot that needs the keyring.
      - name: Regenerate Debian keyring
        if: startsWith(matrix.target, 'linux/') && matrix.libc != 'musl'
        run: |
          rm -f ./naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          # Empty -> action fetches the latest release. Only win/arm64 pins a
          # version (see target.toml), since latest sccache breaks its asm build.
          version: ${{ matrix.sccache_version }}

      # Local-disk mode: sccache writes one cache dir, persisted as a single
      # actions/cache blob per target (the ghac backend's per-object writes get
      # throttled by GitHub's cache service on a build this large).
      - name: Configure sccache (local disk)
        run: |
          echo "SCCACHE_DIR=${{ runner.temp }}/sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=${{ needs.prepare.outputs.sccache_size }}" >> "$GITHUB_ENV"

      - name: Cache sccache directory
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-${{ matrix.name }}-${{ hashFiles('scripts/*.rs') }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ matrix.name }}-${{ hashFiles('scripts/*.rs') }}-
            sccache-${{ matrix.name }}-

      # Chromium 154 builds a macOS 26 code path guarded by __builtin_available.
      - name: Select the macOS 26 SDK for desktop targets
        if: startsWith(matrix.target, 'darwin/')
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcrun --sdk macosx --show-sdk-version

      - name: Build
        run: |
          sccache -z
          just compile "${{ matrix.target }}" "${{ matrix.libc }}"
          sccache -s

      # Preserve the expensive native build even if a later Rust consumer
      # check fails because of its own toolchain or dependency setup.
      - name: Save native compiler cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Package
        run: just package "${{ matrix.target }}" "${{ matrix.libc }}"

      # Keep artifacts available for diagnosis; release-libs still requires
      # every build job, including its consumer checks, to succeed.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            lib/
            include/

      # Link the Rust bindings too: cronet_sample alone does not exercise all
      # exported wrappers or libc++'s MSVC exception support.
      - name: Check Rust static consumer
        if: matrix.name == 'cronet-linux-amd64' || startsWith(matrix.name, 'cronet-windows-amd64')
        env:
          CRONET_RS_REV: 2ca67b906c294f22ab9ab982753090e1337e3e92
        run: |
          git clone https://github.com/rust-proxy/cronet-rs "$RUNNER_TEMP/cronet-rs"
          git -C "$RUNNER_TEMP/cronet-rs" checkout "$CRONET_RS_REV"
          coexist_manifest="$PWD/tests/static-coexist/Cargo.toml"
          if [[ "$RUNNER_OS" == Windows ]]; then
            # Reuse the NASM executable Chromium already built. The runner's
            # base image does not put an assembler on PATH for boring-sys.
            variant=""
            lib_variant=""
            if [[ "${{ matrix.target }}" == */md ]]; then
              variant="-md"
              lib_variant="_md"
              unset RUSTFLAGS
            else
              export RUSTFLAGS="-C target-feature=+crt-static"
            fi
            test -f "$PWD/naiveproxy/src/out/cronet-win-x64${variant}/nasm.exe"
            export PATH="$PWD/naiveproxy/src/out/cronet-win-x64${variant}:$PATH"
            export CRONET_LIB_DIR="$(cygpath -w "$PWD/lib/windows_amd64${lib_variant}")"
            target=x86_64-pc-windows-msvc
          else
            export CRONET_LIB_DIR="$PWD/lib/linux_amd64"
            target=x86_64-unknown-linux-gnu
          fi
          cd "$RUNNER_TEMP/cronet-rs"
          cargo build --workspace --locked --target "$target" --features static-link
          cargo test --workspace --locked --target "$target" --features static-link --lib
          cargo test --manifest-path "$coexist_manifest" --locked --target "$target"

  release-libs:
    needs: [build]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cronet-*
          path: artifacts/
          merge-multiple: false

      - name: Prepare release assets
        run: |
          mkdir -p release

          # Linux glibc shared libraries (.so)
          for dir in artifacts/cronet-linux-*/lib/linux_*; do
            DIRNAME=$(basename "$dir")
            if [[ "$DIRNAME" != *_musl ]]; then
              ARCH="${DIRNAME#linux_}"
              if [ -f "$dir/libcronet.so" ]; then
                cp "$dir/libcronet.so" "release/libcronet-linux-${ARCH}.so"
              fi
            fi
          done

          # Linux static libraries: keep glibc and musl assets distinct.
          for dir in artifacts/cronet-linux-*/lib/linux_*; do
            SLOT=$(basename "$dir" | sed 's/^linux_//')
            cp "$dir/libcronet.a" "release/libcronet-linux-${SLOT}.a"
            cp "$dir/link_flags.txt" "release/libcronet-linux-${SLOT}.link-flags.txt"
          done

          # Android static libraries (.a)
          for dir in artifacts/cronet-android-*/lib/android_*; do
            ARCH=$(basename "$dir" | sed 's/android_//')
            if [ -f "$dir/libcronet.a" ]; then
              cp "$dir/libcronet.a" "release/libcronet-android-${ARCH}.a"
            fi
          done

          # Windows DLLs and MSVC static archives
          for dir in artifacts/cronet-windows-*/lib/windows_*; do
            ARCH=$(basename "$dir" | sed 's/windows_//')
            cp "$dir/cronet.lib" "release/libcronet-windows-${ARCH}.lib"
            cp "$dir/link_flags.txt" "release/libcronet-windows-${ARCH}.link-flags.txt"
            if [ -f "$dir/libcronet.dll" ]; then
              cp "$dir/libcronet.dll" "release/libcronet-windows-${ARCH}.dll"
            fi
          done

          # Darwin (macOS) static libraries (.a)
          for dir in artifacts/cronet-darwin-*/lib/darwin_*; do
            ARCH=$(basename "$dir" | sed 's/darwin_//')
            if [ -f "$dir/libcronet.a" ]; then
              cp "$dir/libcronet.a" "release/libcronet-darwin-${ARCH}.a"
            fi
          done

          # iOS static libraries (.a)
          for dir in artifacts/cronet-ios-*/lib/ios_*; do
            SUBDIR=$(basename "$dir" | sed 's/^ios_//')
            if [ -f "$dir/libcronet.a" ]; then
              cp "$dir/libcronet.a" "release/libcronet-ios-${SUBDIR}.a"
            fi
          done

          # tvOS static libraries (.a)
          for dir in artifacts/cronet-tvos-*/lib/tvos_*; do
            SUBDIR=$(basename "$dir" | sed 's/^tvos_//')
            if [ -f "$dir/libcronet.a" ]; then
              cp "$dir/libcronet.a" "release/libcronet-tvos-${SUBDIR}.a"
            fi
          done

          (cd release && sha256sum libcronet-* > SHA256SUMS)
          ls -la release/

      - name: Publish release for the pushed tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" --verify-tag --latest=false \
            --title "$TAG_NAME" --notes "SagerNet Cronet built from $GITHUB_SHA" release/*
