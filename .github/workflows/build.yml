name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag'
        type: string
        required: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Read .github/target.toml and expose it as a matrix.include payload, so all
  # platforms share the single `build` job below.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.set.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: toml2json,jaq
      - name: Build matrix from target.toml
        id: set
        run: |
          targets=$(toml2json .github/target.toml | jaq -c '.target')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "$targets" | jaq .

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: dtolnay/rust-toolchain@nightly

      - name: Install zstd (musl)
        if: runner.os == 'Linux' && matrix.libc == 'musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      # Only Linux glibc targets pull a Debian sysroot that needs the keyring.
      - name: Regenerate Debian keyring
        if: startsWith(matrix.target, 'linux/') && matrix.libc != 'musl'
        run: |
          rm -f ./naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # Local-disk mode: sccache writes one cache dir, persisted as a single
      # actions/cache blob per target (the ghac backend's per-object writes get
      # throttled by GitHub's cache service on a build this large).
      - name: Configure sccache (local disk)
        run: |
          echo "SCCACHE_DIR=${{ runner.temp }}/sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=2G" >> "$GITHUB_ENV"

      - name: Cache sccache directory
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-${{ matrix.name }}-${{ hashFiles('scripts/build-cronet.rs') }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ matrix.name }}-${{ hashFiles('scripts/build-cronet.rs') }}-
            sccache-${{ matrix.name }}-

      - name: Build
        run: |
          sccache -z
          just compile "${{ matrix.target }}" "${{ matrix.libc }}"
          sccache -s

      - name: Package
        run: just package "${{ matrix.target }}" "${{ matrix.libc }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            lib/
            include/

  release-libs:
    if: (github.event_name == 'push' && github.ref_name == 'main') || github.event_name == 'workflow_dispatch'
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cronet-*
          path: artifacts/
          merge-multiple: false

      - name: Prepare release assets
        run: |
          mkdir -p release

          # Linux glibc shared libraries (.so)
          for dir in artifacts/cronet-linux-*/lib/linux_*; do
            DIRNAME=$(basename "$dir")
            if [[ "$DIRNAME" != *_musl ]]; then
              ARCH="${DIRNAME#linux_}"
              if [ -f "$dir/libcronet.so" ]; then
                cp "$dir/libcronet.so" "release/libcronet-linux-${ARCH}.so"
              fi
            fi
          done

          # Android static libraries (.a)
          for dir in artifacts/cronet-android-*/lib/android_*; do
            ARCH=$(basename "$dir" | sed 's/android_//')
            if [ -f "$dir/libcronet.a" ]; then
              cp "$dir/libcronet.a" "release/libcronet-android-${ARCH}.a"
            fi
          done

          # Windows DLLs
          for dir in artifacts/cronet-windows-*/lib/windows_*; do
            ARCH=$(basename "$dir" | sed 's/windows_//')
            if [ -f "$dir/libcronet.dll" ]; then
              cp "$dir/libcronet.dll" "release/libcronet-windows-${ARCH}.dll"
            fi
          done

          # Darwin (macOS) static libraries (.a)
          for dir in artifacts/cronet-darwin-*/lib/darwin_*; do
            ARCH=$(basename "$dir" | sed 's/darwin_//')
            if [ -f "$dir/libcronet.a" ]; then
              cp "$dir/libcronet.a" "release/libcronet-darwin-${ARCH}.a"
            fi
          done

          # iOS static libraries (.a)
          for dir in artifacts/cronet-ios-*/lib/ios_*; do
            SUBDIR=$(basename "$dir" | sed 's/^ios_//')
            if [ -f "$dir/libcronet.a" ]; then
              cp "$dir/libcronet.a" "release/libcronet-ios-${SUBDIR}.a"
            fi
          done

          # tvOS static libraries (.a)
          for dir in artifacts/cronet-tvos-*/lib/tvos_*; do
            SUBDIR=$(basename "$dir" | sed 's/^tvos_//')
            if [ -f "$dir/libcronet.a" ]; then
              cp "$dir/libcronet.a" "release/libcronet-tvos-${SUBDIR}.a"
            fi
          done

          ls -la release/

      - name: Push tag and create release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # workflow_dispatch with a version -> release that tag; otherwise (push
          # to main, or dispatch with empty version) -> rolling "latest".
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            TAG_NAME="$INPUT_VERSION"
            TITLE="$INPUT_VERSION"
          else
            TAG_NAME="latest"
            TITLE="Latest Build"
          fi
          echo "Releasing tag: $TAG_NAME"
          git tag -f "$TAG_NAME"
          git push origin -f "$TAG_NAME"
          gh release delete "$TAG_NAME" --yes 2>/dev/null || true
          gh release create "$TAG_NAME" --title "$TITLE" --notes "" release/*
