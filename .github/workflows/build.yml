name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag'
        type: string
        required: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # All platforms use sccache with the GitHub Actions cache service as backend.
  SCCACHE_GHA_ENABLED: "true"
  # Pinned: the version validated for the windows/arm64 build.
  SCCACHE_VERSION: "v0.12.0"

defaults:
  run:
    shell: bash

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, "386", arm, loong64, mipsle, mips64le, riscv64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: dtolnay/rust-toolchain@nightly
      - name: Get naiveproxy commit
        id: naive
        run: echo "commit=$(git -C naiveproxy rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: Get Chromium version
        id: chromium
        run: echo "version=$(cat naiveproxy/CHROMIUM_VERSION)" >> $GITHUB_OUTPUT
      - name: Regenerate Debian keyring
        run: |
          rm -f ./naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh
      - name: Cache build artifacts
        id: build-cache
        uses: actions/cache@v4
        with:
          path: naiveproxy/src/out
          key: naive-build-${{ steps.naive.outputs.commit }}-${{ hashFiles('scripts/build-cronet.rs') }}-linux-${{ matrix.arch }}
      - name: Install ninja
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt update
          sudo apt install -y ninja-build
      - name: Setup sccache
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: ${{ env.SCCACHE_VERSION }}
      - name: Build
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          sccache -z
          just compile linux/${{ matrix.arch }}
          sccache -s
      - name: Package
        run: just package linux/${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: cronet-linux-${{ matrix.arch }}
          path: |
            lib/
            include/

  darwin:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin/amd64
            name: darwin-amd64
          - target: darwin/arm64
            name: darwin-arm64
          # iOS
          - target: ios/arm64
            name: ios-arm64
          - target: ios/arm64/simulator
            name: ios-arm64-simulator
          - target: ios/amd64
            name: ios-amd64-simulator
          # tvOS
          - target: tvos/arm64
            name: tvos-arm64
          - target: tvos/arm64/simulator
            name: tvos-arm64-simulator
          - target: tvos/amd64
            name: tvos-amd64-simulator
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: dtolnay/rust-toolchain@nightly
      - name: Get naiveproxy commit
        id: naive
        run: echo "commit=$(git -C naiveproxy rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: Get Chromium version
        id: chromium
        run: echo "version=$(cat naiveproxy/CHROMIUM_VERSION)" >> $GITHUB_OUTPUT
      - name: Cache build artifacts
        id: build-cache
        uses: actions/cache@v4
        with:
          path: naiveproxy/src/out
          key: naive-build-${{ steps.naive.outputs.commit }}-${{ hashFiles('scripts/build-cronet.rs') }}-${{ matrix.name }}
      - name: Install ninja
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: brew install ninja
      - name: Setup sccache
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: ${{ env.SCCACHE_VERSION }}
      - name: Build
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          sccache -z
          just compile ${{ matrix.target }}
          sccache -s
      - name: Package
        run: just package ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: cronet-${{ matrix.name }}
          path: |
            lib/
            include/

  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: dtolnay/rust-toolchain@nightly
      - name: Get naiveproxy commit
        id: naive
        shell: bash
        run: echo "commit=$(git -C naiveproxy rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: Get Chromium version
        id: chromium
        shell: bash
        run: echo "version=$(cat naiveproxy/CHROMIUM_VERSION)" >> $GITHUB_OUTPUT
      - name: Cache build artifacts
        id: build-cache
        uses: actions/cache@v4
        with:
          path: naiveproxy/src/out
          key: naive-build-${{ steps.naive.outputs.commit }}-${{ hashFiles('scripts/build-cronet.rs') }}-windows-${{ matrix.arch }}
      - name: Install ninja
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: choco install ninja -y
      - name: Setup sccache
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: ${{ env.SCCACHE_VERSION }}
      - name: Build
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          sccache -z
          just compile windows/${{ matrix.arch }}
          sccache -s
      - name: Package
        run: just package windows/${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: cronet-windows-${{ matrix.arch }}
          path: |
            lib/
            include/

  android:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64, arm, "386"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: dtolnay/rust-toolchain@nightly
      - name: Get naiveproxy commit
        id: naive
        run: echo "commit=$(git -C naiveproxy rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: Get Chromium version
        id: chromium
        run: echo "version=$(cat naiveproxy/CHROMIUM_VERSION)" >> $GITHUB_OUTPUT
      - name: Cache build artifacts
        id: build-cache
        uses: actions/cache@v4
        with:
          path: naiveproxy/src/out
          key: naive-build-${{ steps.naive.outputs.commit }}-${{ hashFiles('scripts/build-cronet.rs') }}-android-${{ matrix.arch }}
      - name: Install ninja
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt update
          sudo apt install -y ninja-build
      - name: Setup sccache
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: ${{ env.SCCACHE_VERSION }}
      - name: Build
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          sccache -z
          just compile android/${{ matrix.arch }}
          sccache -s
      - name: Package
        run: just package android/${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: cronet-android-${{ matrix.arch }}
          path: |
            lib/
            include/

  linux-musl:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, "386", arm, loong64, mipsle, riscv64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: dtolnay/rust-toolchain@nightly
      - name: Get naiveproxy commit
        id: naive
        run: echo "commit=$(git -C naiveproxy rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: Get Chromium version
        id: chromium
        run: echo "version=$(cat naiveproxy/CHROMIUM_VERSION)" >> $GITHUB_OUTPUT
      - name: Cache build artifacts
        id: build-cache
        uses: actions/cache@v4
        with:
          path: naiveproxy/src/out
          key: naive-build-${{ steps.naive.outputs.commit }}-${{ hashFiles('scripts/build-cronet.rs') }}-linux-musl-${{ matrix.arch }}
      - name: Install packages
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt update
          sudo apt install -y ninja-build zstd
      - name: Setup sccache
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: ${{ env.SCCACHE_VERSION }}
      - name: Build
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          sccache -z
          just compile linux/${{ matrix.arch }} musl
          sccache -s
      - name: Package
        run: just package linux/${{ matrix.arch }} musl
      - uses: actions/upload-artifact@v4
        with:
          name: cronet-linux-musl-${{ matrix.arch }}
          path: |
            lib/
            include/

  release-libs:
    if: (github.event_name == 'push' && github.ref_name == 'main') || github.event_name == 'workflow_dispatch'
    needs: [linux, linux-musl, darwin, windows, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cronet-*
          path: artifacts/
          merge-multiple: false

      - name: Get Chromium version
        id: chromium
        run: echo "version=$(cat naiveproxy/CHROMIUM_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        run: |
          mkdir -p release

          # Linux glibc shared libraries (.so)
          for dir in artifacts/cronet-linux-*/lib/linux_*; do
            DIRNAME=$(basename "$dir")
            if [[ "$DIRNAME" != *_musl ]]; then
              ARCH="${DIRNAME#linux_}"
              if [ -f "$dir/libcronet.so" ]; then
                cp "$dir/libcronet.so" "release/libcronet-linux-${ARCH}.so"
              fi
            fi
          done

          # Android static libraries (.a)
          for dir in artifacts/cronet-android-*/lib/android_*; do
            ARCH=$(basename "$dir" | sed 's/android_//')
            if [ -f "$dir/libcronet.a" ]; then
              cp "$dir/libcronet.a" "release/libcronet-android-${ARCH}.a"
            fi
          done

          # Windows DLLs
          for dir in artifacts/cronet-windows-*/lib/windows_*; do
            ARCH=$(basename "$dir" | sed 's/windows_//')
            if [ -f "$dir/libcronet.dll" ]; then
              cp "$dir/libcronet.dll" "release/libcronet-windows-${ARCH}.dll"
            fi
          done

          # Darwin (macOS) static libraries (.a)
          for dir in artifacts/cronet-darwin-*/lib/darwin_*; do
            ARCH=$(basename "$dir" | sed 's/darwin_//')
            if [ -f "$dir/libcronet.a" ]; then
              cp "$dir/libcronet.a" "release/libcronet-darwin-${ARCH}.a"
            fi
          done

          # iOS static libraries (.a)
          for dir in artifacts/cronet-ios-*/lib/ios_*; do
            SUBDIR=$(basename "$dir" | sed 's/^ios_//')
            if [ -f "$dir/libcronet.a" ]; then
              cp "$dir/libcronet.a" "release/libcronet-ios-${SUBDIR}.a"
            fi
          done

          # tvOS static libraries (.a)
          for dir in artifacts/cronet-tvos-*/lib/tvos_*; do
            SUBDIR=$(basename "$dir" | sed 's/^tvos_//')
            if [ -f "$dir/libcronet.a" ]; then
              cp "$dir/libcronet.a" "release/libcronet-tvos-${SUBDIR}.a"
            fi
          done

          ls -la release/

      - name: Push tag and create release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # workflow_dispatch with a version -> release that tag; otherwise (push
          # to main, or dispatch with empty version) -> rolling "latest".
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            TAG_NAME="$INPUT_VERSION"
            TITLE="$INPUT_VERSION"
          else
            TAG_NAME="latest"
            TITLE="Latest Build"
          fi
          echo "Releasing tag: $TAG_NAME"
          git tag -f "$TAG_NAME"
          git push origin -f "$TAG_NAME"
          gh release delete "$TAG_NAME" --yes 2>/dev/null || true
          gh release create "$TAG_NAME" --title "$TITLE" --notes "" release/*
